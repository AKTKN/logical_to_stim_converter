name: logical-circuit-checks

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and pinned Stim/stimflow dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests examples
      - name: Physics, mapping, lifecycle, and noise tests
        run: python -m pytest -n 8
      - name: Build source distribution and wheel
        run: python -m build
      - name: Two-patch example
        run: python examples/two_patch_memory.py
      - name: Encoded Bell round trip
        run: python examples/two_patch_bell_roundtrip.py
      - name: Knill EC single round (decoder independent)
        run: python examples/knill_ec_single_round.py
      - name: Offline decoder views (one physical batch)
        run: python examples/offline_dem_views.py
      - name: Memory offline MWPM demonstration
        run: python examples/memory_offline_decoding.py --suite --shots 128 --p 0.001 --seed 731
      - name: Knill memory offline stages and wall-time demonstration
        run: python examples/knill_memory_offline_decoding.py --suite --shots 64 --p 0.001 --seed 732
      - name: Three explicit patches, repeated Knill cycles and bounded offline batches
        run: python examples/knill_memory_three_patch_reuse.py --suite --shots 32 --batch-size 13 --p 0.001 --seed 733
      - name: LSTIM source versus independent Python and same-raw offline decoding
        run: python examples/lstim_equivalence.py --shots 32 --p 0.001 --seed 826
      - name: Opt-in ideal resource initialization and post-SE physical noise
        run: python examples/knill_resource_preparation_noise.py --shots 32 --p 0.001 --p-st 0.003
